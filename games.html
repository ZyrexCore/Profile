<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZyrexCore // Games</title><link rel="stylesheet" href="styles.css?v=20261002-v17"><style>.game-search{display:flex;align-items:center;gap:12px;margin:0 0 24px}.game-search input{width:100%;box-sizing:border-box;padding:14px 16px;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(255,255,255,.04);color:#fff;font:inherit;outline:none}.game-search input:focus{border-color:rgba(255,255,255,.55);box-shadow:0 0 0 3px rgba(255,255,255,.05)}.game-search input::placeholder{color:rgba(255,255,255,.42)}.game-search-status{font-size:12px;letter-spacing:.08em;color:rgba(255,255,255,.5);white-space:nowrap}</style></head><body class="gallery-page"><div class="version-badge">V.2.0.7</div><main><section class="page-hero"><div class="eyebrow">ZYREXCORE // ROBLOX</div><h1>MY GAMES.</h1><p>Every published Roblox experience in one place. Game names, descriptions and thumbnails are pulled from Roblox automatically.</p></section><section class="wrap" style="padding-top:20px"><div class="game-search"><input id="gameSearch" type="search" placeholder="Search games by title..." aria-label="Search games by title" autocomplete="off"><span class="game-search-status" id="gameSearchStatus"></span></div><div class="grid" id="gamesGrid"></div></section></main><footer class="footer">ZYREXCORE // PROFILE</footer><script src="portfolio.js?v=20261002-v17"></script><script src="mobile-preview.js?v=20261002-v3"></script><script>bootChrome('games');renderGames('gamesGrid').then(()=>{const input=document.getElementById('gameSearch'),status=document.getElementById('gameSearchStatus'),grid=document.getElementById('gamesGrid');const filter=()=>{const q=input.value.trim().toLowerCase();const cards=[...grid.querySelectorAll('.card')];let visible=0;cards.forEach(card=>{const title=card.querySelector('.game-name')?.textContent.toLowerCase()||'';const show=!q||title.includes(q);card.style.display=show?'':'none';if(show)visible++});status.textContent=q?`${visible} game${visible===1?'':'s'} found`:'';window.dispatchEvent(new Event('resize'))};input.addEventListener('input',filter);filter()});</script></body></html>
